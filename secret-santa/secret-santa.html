<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Frenchie Family, Secret Santa</title>
<style>
  :root {
    --red: #b3202a;
    --red-dark: #8a1820;
    --green: #1f5f3f;
    --cream: #fdf8f0;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #123d29 0%, #1f5f3f 100%);
    min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 60px 20px 60px; }
  .card {
    background: var(--cream);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  h1 { margin: 0 0 6px; text-align: center; color: var(--red); font-size: 2.2rem; }
  .subtitle { text-align: center; color: var(--muted); margin: 0 0 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .name-btn {
    font: inherit; font-size: 1.05rem; font-weight: 600;
    padding: 18px 12px;
    border: 2px solid var(--red);
    border-radius: 12px;
    background: #fff;
    color: var(--red);
    cursor: pointer;
    transition: transform .1s, background .15s, color .15s;
  }
  .name-btn:hover { background: var(--red); color: #fff; transform: translateY(-2px); }
  .error {
    background: #fde8e8; border: 1px solid #e0a0a0; color: #8a1820;
    padding: 14px 16px; border-radius: 10px; margin-bottom: 20px;
  }
  .hidden { display: none !important; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 10;
  }
  .modal {
    background: var(--cream); border-radius: 16px; padding: 28px 24px;
    width: 100%; max-width: 420px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .modal h2 { margin: 0 0 10px; color: var(--red); }
  .modal p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
  .modal input {
    width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px;
    border: 2px solid #ccc; border-radius: 10px; margin-bottom: 8px; text-align: center;
  }
  .modal input:focus { outline: none; border-color: var(--green); }
  .modal .msg { min-height: 1.3em; color: var(--red); font-size: .92rem; margin-bottom: 10px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 600; padding: 11px 20px; border-radius: 10px;
    border: none; cursor: pointer;
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: #174a31; }
  .btn-secondary { background: #e4e0d8; color: var(--ink); }
  .btn-secondary:hover { background: #d6d1c7; }

  /* Reveal */
  .reveal { text-align: center; }
  .reveal .label { color: var(--muted); margin: 0 0 4px; }
  .reveal .giver { font-size: 1.15rem; margin: 0 0 22px; }
  .photo-wrap {
    width: 220px; height: 220px; margin: 0 auto 18px; border-radius: 50%;
    overflow: hidden; border: 6px solid var(--red);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    background: #eee;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.6) rotate(-8deg);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,1.4,.4,1);
  }
  .photo-wrap.show { opacity: 1; transform: scale(1) rotate(0); }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .initials { font-size: 4.5rem; font-weight: 700; color: var(--red); }
  .receiver {
    font-size: 2.4rem; font-weight: 800; color: var(--red); margin: 0 0 26px;
    opacity: 0; transition: opacity .6s ease .5s;
  }
  .receiver.show { opacity: 1; }
  .gift-box {
    font-size: 5rem; cursor: pointer; user-select: none; margin: 10px 0 8px;
    animation: wobble 1.6s ease-in-out infinite;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-4deg); }
    80% { transform: rotate(4deg); }
  }
  .hint { color: var(--muted); margin: 0 0 20px; }

  /* ===================== CRINGY CHRISTMAS EXTRAS ===================== */
  body { overflow-x: hidden; }
  .wrap, .overlay { position: relative; z-index: 2; }
  .overlay { position: fixed; z-index: 20; }

  /* Falling snow */
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .flake {
    position: absolute; top: -40px; color: #fff; user-select: none;
    animation: fall linear infinite;
    text-shadow: 0 0 6px rgba(255,255,255,.8);
  }
  @keyframes fall {
    0%   { transform: translate(0, -40px) rotate(0); }
    25%  { transform: translate(25px, 25vh) rotate(90deg); }
    50%  { transform: translate(-20px, 50vh) rotate(180deg); }
    75%  { transform: translate(20px, 75vh) rotate(270deg); }
    100% { transform: translate(0, 105vh) rotate(360deg); }
  }

  /* Blinking fairy lights */
  #lights {
    position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 5;
    display: flex; justify-content: space-around; pointer-events: none;
    border-top: 3px solid #0b2a1b;
  }
  .bulb {
    width: 14px; height: 22px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    margin-top: 6px; position: relative;
    animation: blink 1s ease-in-out infinite alternate;
  }
  .bulb::before {
    content: ""; position: absolute; top: -6px; left: 3px; width: 8px; height: 6px;
    background: #333; border-radius: 2px;
  }
  .bulb:nth-child(4n+1) { background: #ff3b3b; color: #ff3b3b; }
  .bulb:nth-child(4n+2) { background: #ffd23b; color: #ffd23b; animation-delay: .25s; }
  .bulb:nth-child(4n+3) { background: #3bff7a; color: #3bff7a; animation-delay: .5s; }
  .bulb:nth-child(4n+4) { background: #3bb4ff; color: #3bb4ff; animation-delay: .75s; }
  @keyframes blink {
    from { opacity: .35; box-shadow: none; }
    to   { opacity: 1;   box-shadow: 0 0 14px 4px currentColor; }
  }

  /* Santa flying across the screen */
  #sleigh {
    position: fixed; top: 70px; left: -260px; font-size: 3rem; z-index: 3;
    pointer-events: none; white-space: nowrap;
  }
  #sleigh.fly { animation: fly 9s linear forwards; }
  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(-4deg); }
    25%  { transform: translate(30vw, 40px) rotate(4deg); }
    50%  { transform: translate(60vw, -10px) rotate(-4deg); }
    75%  { transform: translate(90vw, 30px) rotate(4deg); }
    100% { transform: translate(calc(100vw + 300px), 0) rotate(-4deg); }
  }
  #sleigh .bubble {
    position: absolute; top: -26px; left: 20px; font-size: .9rem; font-weight: 700;
    background: #fff; color: var(--red); padding: 3px 9px; border-radius: 10px;
  }

  /* Bouncy title */
  h1 { animation: bounce 2.2s ease-in-out infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-6px) scale(1.03); }
  }
  .rainbow {
    background: linear-gradient(90deg, #b3202a, #e6a817, #1f8f4f, #b3202a);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 3s linear infinite;
  }
  @keyframes rainbow { to { background-position: 300% 0; } }

  /* Pun ticker */
  .pun {
    text-align: center; font-style: italic; color: var(--green);
    min-height: 1.4em; margin: -14px 0 22px; transition: opacity .4s;
  }

  /* Wiggly name buttons */
  .name-btn:hover { animation: jiggle .4s ease-in-out; }
  @keyframes jiggle {
    0%,100% { transform: translateY(-2px) rotate(0); }
    25% { transform: translateY(-2px) rotate(-3deg); }
    75% { transform: translateY(-2px) rotate(3deg); }
  }
  .name-btn::after { content: ""; }
  .name-btn:hover::after { content: " 🎄"; }

  /* Confetti */
  .confetti {
    position: fixed; top: 50%; left: 50%; z-index: 30; pointer-events: none;
    font-size: 1.6rem; will-change: transform, opacity;
  }

  /* Cringy caption under the receiver */
  .caption {
    font-weight: 700; color: var(--green); margin: -14px 0 22px; font-size: 1.1rem;
    opacity: 0; transition: opacity .6s ease 1s;
  }
  .caption.show { opacity: 1; }

  /* Sound toggle */
  #sound-btn {
    position: fixed; bottom: 16px; right: 16px; z-index: 6;
    font-size: 1.4rem; width: 48px; height: 48px; border-radius: 50%;
    border: none; background: var(--cream); cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }

  /* Shake the whole card when the gift opens */
  .card.shake, .modal.shake { animation: cardshake .5s; }
  @keyframes cardshake {
    0%,100% { transform: translate(0); }
    20% { transform: translate(-8px, 2px) rotate(-1deg); }
    40% { transform: translate(8px, -2px) rotate(1deg); }
    60% { transform: translate(-5px, 1px); }
    80% { transform: translate(5px, -1px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #snow, #sleigh, .confetti { display: none; }
    h1, .bulb, .gift-box, .rainbow { animation: none !important; }
  }
</style>
</head>
<body>
<div id="snow"></div>
<div id="lights"></div>
<div id="sleigh">🦌🦌🦌🛷🎅<span class="bubble">HO HO HO!</span></div>
<button id="sound-btn" title="Sound on/off">🔔</button>

<div class="wrap">
  <div class="card">
    <!-- Name selection screen -->
    <div id="screen-list">
      <h1>🎅 <span class="rainbow">Frenchie Family, Secret Santa <span id="year-label"></span></span> 🎄</h1>
      <p class="subtitle">Click on your name to find out who you are giving a present to.</p>
      <p id="pun" class="pun"></p>
      <div id="error" class="error hidden"></div>
      <div id="names" class="grid"></div>
    </div>

    <!-- Reveal screen -->
    <div id="screen-reveal" class="reveal hidden">
      <p class="label">Hi</p>
      <p class="giver"><strong id="giver-name"></strong>, you are the Secret Santa of…</p>
      <div id="gift" class="gift-box" title="Open me!">🎁</div>
      <p id="gift-hint" class="hint">Click the present to open it</p>
      <div id="photo" class="photo-wrap hidden"></div>
      <p id="receiver-name" class="receiver hidden"></p>
      <p id="caption" class="caption hidden"></p>
      <div class="actions">
        <button class="btn btn-secondary" id="back-btn">Hide &amp; go back</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirmation modal -->
<div id="overlay" class="overlay hidden">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <input id="modal-input" autocomplete="off" />
    <div id="modal-msg" class="msg"></div>
    <div class="actions">
      <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="confirm-btn">Reveal</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 *  CONFIGURATION — edit this part only
 * ===================================================================== */
const CONFIG = {
  year: 2026,

  // Any text. The draw is computed from this, so everyone visiting the page
  // sees the SAME draw. Change it (e.g. add "-v2") to redo the draw.
  // Do NOT change it once people have started looking at their result!
  seed: "secret-santa-2026",

  // Each person must answer THEIR question correctly to see who they picked.
  //   photo:    URL or relative path. Leave "" to show initials.
  //   question: the question shown to that person.
  //   answers:  list of accepted answers. Case, accents, punctuation and extra
  //             spaces are ignored, so "Saint-Étienne" = "saint etienne".
  //             Add variants if needed, e.g. ["Rex", "Rexy"].
  //   If a person has no question (or "TODO"), they just type their own name.
  participants: [
    { name: "Auntie Rosie", photo: "photos/Rosie.png",
      question: "Who is your most handsome nephew?", answers: ["Scott", "Scotty"] },
    { name: "Uncle Norman", photo: "photos/Norman.png",
      question: "Who is the most beautiful woman on this planet?", answers: ["Rosie", "Rosemary"] },
    { name: "Uncle Don", photo: "photos/Don.png",
      question: "🎤 Hey there... who? Complete the title of this 2006 acoustic hit.", answers: ["Delilah", "Hey there Delilah"] },
    { name: "Uncle Jock", photo: "photos/Jock.png",
      question: "Who won the Tour de France this year?", answers: ["Pogacar", "Tadej Pogacar", "Pogi"] },
    { name: "Papa (Denis)", photo: "photos/Papa.png",
      question: "Which kinetic equation, describing the evolution of the particle distribution function in a collisionless plasma, is the starting point for most laser-plasma simulations (particle-in-cell codes are essentially a way of solving it)?", answers: ["Vlasov", "Vlasov equation", "Vlasov-Maxwell", "Vlasov-Poisson", "Collisionless Boltzmann"] },
    { name: "Mac", photo: "photos/Mac.png",
      question: "Quel jeu de tir à la première personne, sorti en 1993, a popularisé le genre FPS et a ensuite été porté sur des appareils aussi improbables qu’un test de grossesse ?", answers: ["Doom"] },
    { name: "Scott", photo: "photos/Scott.png",
      question: "Are you Scott?", answers: ["yes", "oui", "y"] },
    { name: "Craig", photo: "photos/Craig.png",
      question: "Quel est le nom du premier bloc coté 9A ?", answers: ["Burden of Dreams", "Burden of Dream"] },
    { name: "Aileen", photo: "photos/Aileen.png",
      question: "Au water-polo, comment s’appelle le joueur offensif qui se place près du but adverse ?", answers: ["Pointe", "Pointu", "Cavalier"] },
    { name: "Auntie Jackie", photo: "photos/Jackie.png",
      question: "What is the secret to successful Yorkshire puddings?", answers: ["Hot oven", "A very hot oven", "Very hot oven", "Hot", "Very hot"] },
    { name: "Elspeth", photo: "photos/Elspeth.png",
      question: "Who was the first project architect for the University of York?", answers: ["Andrew Derbyshire", "Derbyshire"] },
    { name: "Angus", photo: "photos/Angus.png",
      question: "Which Indian conglomerate has owned Jaguar since 2008, when it bought the brand from Ford?", answers: ["Tata", "Tata Motors", "Tata Group"] },
  ],

  // Previous draws: { giver: receiver }. Nobody will get the same person
  // as in any of these years. Names must match the participants list exactly.
  // People who were not there last year can simply be left out.
  history: {
    2025: {
      "Aileen":       "Uncle Norman",
      "Craig":        "Papa (Denis)",
      "Papa (Denis)": "Uncle Jock",
      "Uncle Don":    "Scott",
      "Mac":          "Aileen",
      "Uncle Norman": "Auntie Rosie",
      "Auntie Rosie": "Mac",        // not shown in screenshot, deduced (only one left)
      // Not participating this year: Fiona -> Uncle Don, Scott -> Fiona,
      //                              Hadi -> Craig, Uncle Jock -> Hadi
    },
    2024: {
      "Aileen":        "Angus",
      "Angus":         "Elspeth",      // "Elsie" on drawnames
      "Craig":         "Aileen",
      "Uncle Don":     "Uncle Jock",
      "Elspeth":       "Papa (Denis)",
      "Auntie Jackie": "Craig",
      "Uncle Jock":    "Uncle Norman",
      "Mac":           "Scott",
      "Uncle Norman":  "Mac",
      "Auntie Rosie":  "Auntie Jackie",
      "Scott":         "Auntie Rosie",
      // Not participating this year: Papa (Denis) -> Fiona, Fiona -> Uncle Don
    },
  },

  // Optional extra rules: pairs who should never draw each other (e.g. couples).
  // Applies in both directions.
  neverPair: [
    ["Uncle Norman", "Auntie Rosie"],
    ["Uncle Jock", "Auntie Jackie"],
  ],
};
/* ===================================================================== */


/* ---------- Deterministic random generator (same result on every device) ---------- */
function hashString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- The draw ---------- */
function computeDraw(config) {
  const names = config.participants.map(p => p.name);
  const nameSet = new Set(names);
  const warnings = [];
  const dupes = names.filter((n, i) => names.indexOf(n) !== i);
  dupes.forEach(n => warnings.push(`participants: "${n}" appears more than once`));

  // Forbidden receivers for each giver
  const forbidden = {};
  names.forEach(n => (forbidden[n] = new Set([n])));

  for (const [year, draw] of Object.entries(config.history || {})) {
    for (const [giver, receiver] of Object.entries(draw)) {
      if (!nameSet.has(giver) || !nameSet.has(receiver)) {
        if (!nameSet.has(giver)) warnings.push(`history ${year}: "${giver}" (in "${giver}": "${receiver}")`);
        if (!nameSet.has(receiver)) warnings.push(`history ${year}: "${receiver}" (in "${giver}": "${receiver}")`);
        continue;
      }
      forbidden[giver].add(receiver);
    }
  }
  for (const [a, b] of config.neverPair || []) {
    if (nameSet.has(a) && nameSet.has(b)) {
      forbidden[a].add(b);
      forbidden[b].add(a);
    } else {
      if (!nameSet.has(a)) warnings.push(`neverPair: "${a}" (in ["${a}", "${b}"])`);
      if (!nameSet.has(b)) warnings.push(`neverPair: "${b}" (in ["${a}", "${b}"])`);
    }
  }

  const rand = mulberry32(hashString(config.seed + "|" + config.year));
  // Handle the most constrained givers first (faster), ties broken randomly.
  const givers = shuffle(names, rand).sort((x, y) => forbidden[y].size - forbidden[x].size);
  const candidates = {};
  givers.forEach(g => (candidates[g] = shuffle(names.filter(r => !forbidden[g].has(r)), rand)));

  const result = {};
  const taken = new Set();
  let steps = 0;
  function solve(i) {
    if (++steps > 2e6) return false;
    if (i === givers.length) return true;
    const g = givers[i];
    for (const r of candidates[g]) {
      if (taken.has(r)) continue;
      result[g] = r; taken.add(r);
      if (solve(i + 1)) return true;
      taken.delete(r); delete result[g];
    }
    return false;
  }
  const ok = names.length >= 2 && solve(0);
  return { ok, result: ok ? result : null, warnings };
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const draw = computeDraw(CONFIG);
const byName = Object.fromEntries(CONFIG.participants.map(p => [p.name, p]));
let currentGiver = null;
const MAX_ATTEMPTS = 5;      // after this many wrong answers, show the answer and let them in
let wrongAttempts = 0;
let givenUp = false;
let givenUpAt = 0;

$("year-label").textContent = CONFIG.year;

const normalize = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

function showError(html) {
  $("error").innerHTML = html;
  $("error").classList.remove("hidden");
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

if (draw.warnings.length) {
  showError("<strong>⚠️ Name error in the configuration</strong> — these names don't match the participants list exactly " +
            "(check spelling, capitals and spaces):<ul>" +
            draw.warnings.map(w => `<li>${esc(w)}</li>`).join("") +
            "</ul>Valid names are: " + CONFIG.participants.map(p => `<code>${esc(p.name)}</code>`).join(", ") +
            ".<br>People who are not taking part this year must be removed (or commented out with <code>//</code>).");
} else if (!draw.ok) {
  showError("<strong>No valid draw is possible</strong> with the current rules " +
            "(too many exclusions from previous years). Remove a year of history or a neverPair rule.");
} else {
  CONFIG.participants.forEach(p => {
    const b = document.createElement("button");
    b.className = "name-btn";
    b.textContent = p.name;
    b.addEventListener("click", () => openConfirm(p.name));
    $("names").appendChild(b);
  });
}

function hasQuestion(p) {
  return p.question && !/^TODO/i.test(p.question) && Array.isArray(p.answers) && p.answers.length;
}

function openConfirm(name) {
  currentGiver = name;
  const p = byName[name];
  $("modal-title").textContent = `Are you ${name}?`;
  if (hasQuestion(p)) {
    $("modal-text").textContent = `Prove it! ${p.question}`;
    $("modal-input").placeholder = "Your answer";
  } else {
    $("modal-text").textContent =
      `If you're not ${name}, please don't peek! To confirm, type your name below.`;
    $("modal-input").placeholder = "Type your name";
  }
  $("modal-input").value = "";
  $("modal-input").disabled = false;
  $("confirm-btn").textContent = "Reveal";
  $("modal-msg").textContent = "";
  wrongAttempts = 0;
  givenUp = false;
  $("overlay").classList.remove("hidden");
  setTimeout(() => $("modal-input").focus(), 50);
}

function closeConfirm() {
  $("overlay").classList.add("hidden");
}

function tryConfirm() {
  if (givenUp) {
    if (Date.now() - givenUpAt < 1500) return;   // give them time to read the answer
    closeConfirm(); showReveal(currentGiver); return;
  }

  const val = normalize($("modal-input").value);
  const p = byName[currentGiver];
  const accepted = hasQuestion(p) ? p.answers : [currentGiver];
  if (!val) return;   // empty submissions don't count

  if (!accepted.some(a => normalize(String(a)) === val)) {
    wrongAttempts++;
    playWrong();
    const m = document.querySelector(".modal");
    m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake");

    if (wrongAttempts >= MAX_ATTEMPTS) {
      givenUp = true;
      givenUpAt = Date.now();
      $("modal-msg").innerHTML = "";
      $("modal-msg").append(
        `${MAX_ATTEMPTS} wrong answers… 🙈 The correct answer was: `,
        Object.assign(document.createElement("strong"), { textContent: String(accepted[0]) }),
        ". Santa will let you in anyway, just this once! 🎅"
      );
      $("modal-input").disabled = true;
      $("confirm-btn").textContent = "Let me in 🎅";
      setTimeout(() => $("confirm-btn").focus(), 1500);
      return;
    }

    const left = MAX_ATTEMPTS - wrongAttempts;
    $("modal-msg").textContent = (hasQuestion(p)
      ? pick(["Wrong answer! Are you sure you're " + currentGiver + "? 🤨",
              "Nope! The elves are watching you. 👀",
              "Incorrect! Santa has added you to the naughty list. 📜"])
      : `That doesn't match "${currentGiver}".`)
      + ` (${left} ${left === 1 ? "try" : "tries"} left)`;
    $("modal-input").select();
    return;
  }
  playRight();
  closeConfirm();
  showReveal(currentGiver);
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
}

function showReveal(giver) {
  const receiver = draw.result[giver];
  const rp = byName[receiver];

  $("giver-name").textContent = giver;
  $("gift").classList.remove("hidden");
  $("gift-hint").classList.remove("hidden");

  const photo = $("photo");
  photo.className = "photo-wrap hidden";
  photo.innerHTML = "";
  if (rp.photo) {
    const img = new Image();
    img.alt = receiver;
    img.src = rp.photo;
    img.onerror = () => { photo.innerHTML = `<span class="initials">${initials(receiver)}</span>`; };
    photo.appendChild(img);
  } else {
    photo.innerHTML = `<span class="initials">${initials(receiver)}</span>`;
  }

  const rn = $("receiver-name");
  rn.className = "receiver hidden";
  rn.textContent = receiver;

  $("screen-list").classList.add("hidden");
  $("screen-reveal").classList.remove("hidden");
}

function openGift() {
  $("gift").classList.add("hidden");
  $("gift-hint").classList.add("hidden");
  $("photo").classList.remove("hidden");
  $("receiver-name").classList.remove("hidden");
  const cap = $("caption");
  cap.textContent = pick(CAPTIONS);
  cap.className = "caption";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("photo").classList.add("show");
    $("receiver-name").classList.add("show");
    cap.classList.add("show");
  }));
  const card = document.querySelector(".card");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  confettiBurst();
  playJingle();
}

function goBack() {
  // Wipe the result from the page so the next person can't see it.
  $("receiver-name").textContent = "";
  $("caption").textContent = "";
  $("photo").innerHTML = "";
  currentGiver = null;
  $("screen-reveal").classList.add("hidden");
  $("screen-list").classList.remove("hidden");
}

$("gift").addEventListener("click", openGift);
$("back-btn").addEventListener("click", goBack);
$("cancel-btn").addEventListener("click", closeConfirm);
$("confirm-btn").addEventListener("click", tryConfirm);
$("modal-input").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); tryConfirm(); }
  if (e.key === "Escape") closeConfirm();
});
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeConfirm(); });

/* Rotating puns */
(function rotatePuns() {
  const el = $("pun");
  let order = PUNS.slice().sort(() => Math.random() - 0.5), i = 0;
  const show = () => {
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = order[i++ % order.length]; el.style.opacity = 1; }, 400);
  };
  show();
  setInterval(show, 6500);
})();

/* Confetti burst */
function confettiBurst() {
  if (reducedMotion) return;
  const glyphs = ["🎉", "🎊", "⭐", "❄️", "🎁", "🍬", "🔔", "🎄", "✨", "🦌"];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    c.textContent = pick(glyphs);
    document.body.appendChild(c);
    const angle = Math.random() * Math.PI * 2;
    const dist = 150 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.5;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
    c.animate([
      { transform: "translate(-50%,-50%) scale(.3) rotate(0)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2) rotate(${Math.random()*720-360}deg)`, opacity: 1, offset: .7 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 120}px)) scale(1) rotate(${Math.random()*720-360}deg)`, opacity: 0 },
    ], { duration: 1800 + Math.random() * 1000, easing: "cubic-bezier(.15,.8,.3,1)" })
     .onfinish = () => c.remove();
  }
}

/* Jingle Bells (public domain), played with the Web Audio API */
let soundOn = true;
$("sound-btn").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sound-btn").textContent = soundOn ? "🔔" : "🔕";
});
function playJingle() {
  if (!soundOn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  const E = 659.25, G = 783.99, C = 523.25, D = 587.33;
  // "Jingle bells, jingle bells, jingle all the way"
  const tune = [
    [E,1],[E,1],[E,2], [E,1],[E,1],[E,2], [E,1],[G,1],[C,1.5],[D,.5],[E,4],
  ];
  const beat = 0.18;
  let t = ctx.currentTime + 0.05;
  for (const [freq, len] of tune) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + len * beat * 0.95);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + len * beat);
    // sleigh-bell sparkle
    if (Math.random() < 0.6) {
      const b = ctx.createOscillator(), bg = ctx.createGain();
      b.type = "square"; b.frequency.value = freq * 4;
      bg.gain.setValueAtTime(0.03, t);
      bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      b.connect(bg).connect(ctx.destination);
      b.start(t); b.stop(t + 0.1);
    }
    t += len * beat;
  }
  setTimeout(() => ctx.close(), (t - ctx.currentTime + 0.5) * 1000);
}

/* Short sound effects: notes = [[freq, startSec, durSec, type, volume, slideToFreq?], ...] */
function playNotes(notes) {
  if (!soundOn) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC(), t0 = ctx.currentTime + 0.03;
  let end = 0;
  for (const [f, start, dur, type, vol, slideTo] of notes) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    const t = t0 + start;
    osc.type = type;
    osc.frequency.setValueAtTime(f, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.setValueAtTime(vol, t + dur * 0.7);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
    end = Math.max(end, start + dur);
  }
  setTimeout(() => ctx.close(), (end + 0.5) * 1000);
}
